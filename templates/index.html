<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EchoDoc</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<!-- Highlight.js (core + python) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script>hljs.registerLanguage("python", window.hljs.getLanguage("python"));</script>

<!-- Marked (Markdown parser) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<!-- DOMPurify (sanitize HTML) -->
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>

<style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 2rem; background:#fcfcfc; color:#333; }
    .container { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:1.5rem; }
    button { font-size:1.1rem; padding:.8rem 1.2rem; border-radius:.6rem; border:1px solid #ccc; cursor:pointer; background:#fff; }
    button.recording { background:#e57373; color:#fff; border-color:#d32f2f; }
    pre.code { background:#0f172a; color:#e2e8f0; padding:1rem; border-radius:.6rem; overflow:auto; }
    h2 { border-bottom:2px solid #eee; padding-bottom:.5rem; color:#555; }
    section { background:#fff; border:1px solid #e0e0e0; border-radius:.8rem; padding:1rem 1.5rem; }
    .md code:not(pre code) { background:#f4f5f6; padding:.2rem .4rem; border-radius:.35rem; }
</style>
</head>

  <body>
    <div class="container">
      <header class="stack">
        <h1>EchoDoc</h1>
        <p>Click to record your coding request; click again to stop and process.</p>
      </header>

      <button id="recordBtn">Click to Start Recording</button>

      <section class="stack">
        <h2>Generated Code</h2>
        <!-- Keep code in <pre><code> for copy/scan -->
        <pre id="code-output" class="code"><code>Waiting for you to record a prompt…</code></pre>
      </section>

      <section class="stack">
        <h2>Review</h2>
        <!-- Rendered from Markdown -->
        <div id="review-output" class="md">Waiting…</div>
      </section>

      <section class="stack">
        <h2>Documentation</h2>
        <!-- Rendered from Markdown -->
        <div id="docs-output" class="md">Waiting…</div>
      </section>
    </div>

    <script>
      // Configure marked to use highlight.js for fenced code blocks
      marked.setOptions({
        highlight: (code, lang) => {
          try {
            if (lang && hljs.getLanguage(lang)) {
              return hljs.highlight(code, { language: lang }).value;
            }
          } catch {}
          return hljs.highlightAuto(code).value;
        },
        breaks: true
      });

      const recordBtn = document.getElementById('recordBtn');
      const codeOutput = document.getElementById('code-output').querySelector('code');
      const reviewOutput = document.getElementById('review-output');
      const docsOutput = document.getElementById('docs-output');

      let mediaRecorder;
      let audioChunks = [];
      let isRecording = false;

      function renderMarkdownInto(el, markdownText) {
        const raw = markdownText || '';
        const html = marked.parse(raw);
        const clean = DOMPurify.sanitize(html);
        el.innerHTML = clean;
        // (Re)highlight any code blocks
        el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      }

      function renderCodeInto(elCode, codeText) {
        elCode.textContent = codeText || 'No code returned.';
        // Optionally highlight code block itself (python is common)
        hljs.highlightElement(elCode);
      }

      async function handleRecordClick() {
        if (!isRecording) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const options = { mimeType: 'audio/webm;codecs=opus' };
            mediaRecorder = new MediaRecorder(stream, options);

            audioChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
            mediaRecorder.onstop = sendAudioToServer;

            mediaRecorder.start();
            isRecording = true;
            recordBtn.textContent = 'Stop Recording';
            recordBtn.classList.add('recording');
          } catch (err) {
            console.error('Mic access error:', err);
            alert('Could not access the microphone. Check site permissions and OS privacy settings.');
          }
        } else {
          mediaRecorder.stop();
          isRecording = false;
          recordBtn.textContent = 'Processing...';
          recordBtn.classList.remove('recording');
          recordBtn.disabled = true;
        }
      }

      async function sendAudioToServer() {
        try {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          audioChunks = [];
          const formData = new FormData();
          formData.append('audio', blob, 'prompt.webm');

          renderCodeInto(codeOutput, 'Transcribing and generating code…');
          renderMarkdownInto(reviewOutput, '...');
          renderMarkdownInto(docsOutput, '...');

          const res = await fetch('/generate', { method: 'POST', body: formData });
          if (!res.ok) {
            let msg = `Server responded with status: ${res.status}`;
            try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
            throw new Error(msg);
          }
          const data = await res.json();

          renderCodeInto(codeOutput, data.code || 'No code returned.');
          renderMarkdownInto(reviewOutput, data.review || 'No review returned.');
          renderMarkdownInto(docsOutput, data.docs || 'No documentation returned.');
        } catch (err) {
          console.error('Backend error:', err);
          renderCodeInto(codeOutput, `An error occurred: ${err.message}`);
          renderMarkdownInto(reviewOutput, '');
          renderMarkdownInto(docsOutput, '');
        } finally {
          recordBtn.textContent = 'Click to Start Recording';
          recordBtn.disabled = false;
        }
      }

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        recordBtn.addEventListener('click', handleRecordClick);
      } else {
        recordBtn.textContent = 'Media Recorder Not Supported';
        recordBtn.disabled = true;
        alert('Your browser does not support the MediaRecorder API. Try Chrome or Edge.');
      }
    </script>
  </body>
</html>
